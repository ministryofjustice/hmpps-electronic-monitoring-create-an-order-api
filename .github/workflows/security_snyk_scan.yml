name: Security Snyk Docker image scan
on:
  workflow_dispatch:
  schedule:
    - cron: "24 7 * * MON-FRI" # Every weekday at 07:00 UTC

jobs:
  security-snyk-check:
    permissions:
      contents: read
      actions: read
      security-events: write
    name: Docker image scan
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/security_snyk_scan.yml@v2 # WORKFLOW_VERSION
    with:
      channel_id: ${{ vars.SECURITY_ALERTS_SLACK_CHANNEL_ID || 'NO_SLACK' }}
      severity: 'HIGH,CRITICAL'
      scan_type: 'image' # or 'fs'
      slack_include_summary: true
    secrets:
      HMPPS_SNYK_CLIENT_SECRET: ${{ secrets.HMPPS_SNYK_CLIENT_SECRET }}
      HMPPS_SNYK_CLIENT_ID: ${{ secrets.HMPPS_SNYK_CLIENT_ID }}
      HMPPS_SRE_SLACK_BOT_TOKEN: ${{ secrets.HMPPS_SRE_SLACK_BOT_TOKEN }}