---
# Per environment values which override defaults in hmpps-electronic-monitoring-create-an-order-api/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: hmpps-electronic-monitoring-create-an-order-api-test.hmpps.service.justice.gov.uk

  namespace_secrets:
    sqs-court-case-events-fifo-secret:
      HMPPS_SQS_QUEUES_COURTHEARINGEVENTQUEUE_QUEUENAME: "sqs_queue_name"
      HMPPS_SQS_QUEUES_COURTHEARINGEVENTQUEUE_QUEUEARN: "sqs_queue_arn"
    sqs-court-case-events-fifo-dlq-secret:
      HMPPS_SQS_QUEUES_COURTHEARINGEVENTQUEUE_DLQNAME: "sqs_queue_name"
    sqs-returns-events-fifo-secret:
      HMPPS_SQS_QUEUES_RETURNSEVENTQUEUE_QUEUENAME: "sqs_queue_name"
      HMPPS_SQS_QUEUES_RETURNSEVENTQUEUE_QUEUEARN: "sqs_queue_arn"
    sqs-returns-events-fifo-dlq-secret:
      HMPPS_SQS_QUEUES_RETURNSEVENTQUEUE_DLQNAME: "sqs_queue_name"

  env:
    SPRING_PROFILES_ACTIVE: dev
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS_AUTH_URL: "https://sign-in-dev.hmpps.service.justice.gov.uk/auth"
    DOCUMENT_MANAGEMENT_URL: "https://document-api-dev.hmpps.service.justice.gov.uk/"
    CP_PROCESSING_ENABLED: false
    CP_FMS_INTEGRATION_ENABLED: true
    RETURN_LISTENER_ENABLED: false
    SETTINGS_DATA_DICTIONARY_VERSION: DDV7
    DDV6_COURT_MAPPINGS: true
    MANAGE_USER_URL: "https://manage-users-api-dev.hmpps.service.justice.gov.uk/"
    CORE_PERSON_RECORD_URL: "https://hmpps-person-record-dev.hmpps.service.justice.gov.uk/"
    CVL_URL: "https://create-and-vary-a-licence-api-dev.hmpps.service.justice.gov.uk/"
    CVL_INTEGRATION_ENABLED: true


# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  alertSeverity: hmpps-ems-cemo-ui-dev
